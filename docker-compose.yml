services:
  postgis:
    image: postgis/postgis:16-3.5
    # postgis/postgis has no native arm64 image for this tag; force amd64
    # (runs fine under Docker Desktop's emulation on Apple Silicon).
    platform: linux/amd64
    container_name: gjej_pro_postgis
    environment:
      POSTGRES_DB: ${DB_NAME:-gjej_pro_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5433:5432"
    volumes:
      - gjej_pro_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gjej_pro_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gjej_pro_postgis_data:
